# 一键跑起来：
#   1.（可选）cp validator/.env.example validator/.env 填 key —— 不填也行，浏览器里填 / 只存浏览器
#   2. docker compose up -d --build
#   3. 电脑/手机浏览器打开 http://<这台机器的IP>:8000/app
#
# 数据都在 ./server/data，删容器不丢人（格）。
# key 不进镜像：要么浏览器填（存你本机），要么用 .env（通过下方 env_file 注入环境变量）。

services:
  persona:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./server/data:/app/server/data
    # 没有 .env 文件也能起（required:false）；有则用服务端 key，没有就浏览器填
    env_file:
      - path: ./validator/.env
        required: false
    restart: unless-stopped
